plugins {
    id 'java-library'
    id 'application'
}

group = 'research.sootup'
version = '1.0.0-SNAPSHOT'
description = 'Standalone editable Qilin module backed by released SootUp jars'

ext {
    sootupVersion = '2.0.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api "org.soot-oss:sootup.java.bytecode.frontend:${sootupVersion}"
    api "org.soot-oss:sootup.callgraph:${sootupVersion}"

    implementation 'commons-cli:commons-cli:1.5.0'
    implementation 'com.github.oshi:oshi-core:6.4.0'
    implementation 'de.upb.cs.swt:heros:1.2.3'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'commons-io:commons-io:2.16.1'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.13'

    testImplementation 'junit:junit:4.13.1'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
}

application {
    mainClass = 'qilin.driver.Main'
}

tasks.register('fatJar', Jar) {
    description = 'Assembles an executable all-in-one SootUp-Qilin jar with runtime dependencies.'
    group = 'distribution'
    dependsOn classes
//    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { File dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

def configureQilinRuntime = { Test task ->
    task.maxHeapSize = '4g'
    task.maxParallelForks = 1
    task.systemProperty 'qilin.test.classes', layout.buildDirectory.dir('classes/java/test').get().asFile.absolutePath
    task.systemProperty 'qilin.test.reflection.dir', file('src/test/java/qilin/microben/core/reflog').absolutePath
    if (project.hasProperty('qilinJre')) {
        task.systemProperty 'qilin.jre', project.property('qilinJre')
    }
}

test {
    useJUnit()
    exclude 'qilin/test/**'
    configureQilinRuntime(delegate)
}

tasks.register('upstreamTest', Test) {
    description = 'Runs the imported upstream Qilin microbenchmark tests (requires -PqilinJre=...).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    include 'qilin/test/**'
    configureQilinRuntime(delegate)
    doFirst {
        if (!project.hasProperty('qilinJre')) {
            throw new GradleException('upstreamTest requires -PqilinJre=<path-to-Java-8-or-earlier-JRE>.')
        }
    }
}

def dacapo2006MainClasses = [
    antlr   : 'dacapo.antlr.Main',
    bloat   : 'dacapo.bloat.Main',
    chart   : 'dacapo.chart.Main',
    eclipse : 'dacapo.eclipse.Main',
    fop     : 'dacapo.fop.Main',
    luindex : 'dacapo.luindex.Main',
    lusearch: 'dacapo.lusearch.Main',
    pmd     : 'dacapo.pmd.Main',
    xalan   : 'dacapo.xalan.Main'
]

tasks.register('runDacapo2006', JavaExec) {
    description = 'Runs SootUp-Qilin on an imported DaCapo 2006 benchmark (requires -PqilinJre=...).'
    group = 'verification'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'qilin.driver.Main'
    maxHeapSize = (project.findProperty('qilinHeap') ?: '8g').toString()

    doFirst {
        String benchmark = (project.findProperty('benchmark') ?: 'antlr').toString()
        String pta = (project.findProperty('pta') ?: 'insens').toString()
        if (!dacapo2006MainClasses.containsKey(benchmark)) {
            throw new GradleException(
                "Unknown DaCapo 2006 benchmark '${benchmark}'. Available benchmarks: ${dacapo2006MainClasses.keySet().join(', ')}")
        }
        if (!project.hasProperty('qilinJre')) {
            throw new GradleException('runDacapo2006 requires -PqilinJre=<path-to-jre1.6.0_45>.')
        }

        File benchmarkDir = file('benchmarks/dacapo2006')
        File appJar = new File(benchmarkDir, "${benchmark}.jar")
        File libJar = new File(benchmarkDir, "${benchmark}-deps.jar")
        File reflectionLog = new File(benchmarkDir, "${benchmark}-refl.log")
        File jre = file(project.property('qilinJre'))
        [appJar, libJar, reflectionLog, jre].each { File input ->
            if (!input.exists()) {
                throw new GradleException("Required Qilin input does not exist: ${input.absolutePath}")
            }
        }

        List<String> runtimeArgs = [
            "-pta=${pta}",
            '-apppath', appJar.absolutePath,
            '-libpath', libJar.absolutePath,
            '-reflectionlog', reflectionLog.absolutePath,
            '-mainclass', dacapo2006MainClasses[benchmark],
            '-jre', jre.absolutePath
        ]
        if ((project.findProperty('experimentOptions') ?: 'false').toString().toBoolean()) {
            runtimeArgs.addAll(['-pae', '-pe', '-clinit=ONFLY', '-lcs', '-mh'])
        }
        if ((project.findProperty('singleEntry') ?: 'false').toString().toBoolean()) {
            runtimeArgs.add('-singleentry')
        }
        if ((project.findProperty('dumpStats') ?: 'false').toString().toBoolean()) {
            runtimeArgs.add('-dumpstats')
        }
        setArgs(runtimeArgs)
        logger.lifecycle("Running Qilin PTA '${pta}' on DaCapo 2006 '${benchmark}' with ${maxHeapSize} heap.")
    }
}
